AWSTemplateFormatVersion: '2010-09-09'
Description: MonsoonRoute isolated SAM deployment package bucket, no active workloads
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod]
Resources:
  DeploymentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'monsoonroute-${Environment}-sam-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: PackageExpiry
            Status: Enabled
            Prefix: builds/
            ExpirationInDays: 14
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: IncompleteUploadCleanup
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - {Key: Project, Value: MonsoonRoute}
        - {Key: Environment, Value: prod}
        - {Key: ManagedBy, Value: CloudFormation}
  DeploymentBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DeploymentBucket.Arn
              - !Sub '${DeploymentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  DeploymentBucketArn:
    Value: !GetAtt DeploymentBucket.Arn
