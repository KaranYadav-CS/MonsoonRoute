name: monsoonroute-production-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: monsoonroute-production
  cancel-in-progress: false
jobs:
  protected_release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Refuse unverified infrastructure or publication
        run: |
          echo "Production release intentionally gated until P5: locked npm deps, graph/model manifests, Git integration, AWS OIDC role and end-to-end approvals"
          exit 2
