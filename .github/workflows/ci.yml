name: monsoonroute-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4 release
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 release
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests/integration -v
      - run: python scripts/release_doctor.py
        continue-on-error: true # report known blockers; release workflow never trusts this as a pass
