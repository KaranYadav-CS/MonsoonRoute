name: monsoonroute-promote-verified-onnx-to-s3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify protected AWS target role is configured
        env:
          MODEL_UPLOAD_ROLE_ARN: ${{ vars.AWS_MODEL_UPLOAD_ROLE_ARN }}
        run: |
          test "$MODEL_UPLOAD_ROLE_ARN" = 'arn:aws:iam::043063712559:role/monsoonroute-gh-model-uploader' || { echo 'REQUIRED_KARAN_ROLE_NOT_CONFIGURED'; exit 2; }
      - name: Download independently validated CPU ONNX from immutable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          gh run download 38134804126 --repo KaranYadav-CS/MonsoonRoute --name monsoonroute-onnx-numerical-only --dir "$RUNNER_TEMP/model"
      - name: Validate exact bytes and restrict export status
        env:
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          python - <<'PY'
          import os,json,hashlib,pathlib
          p=pathlib.Path(os.environ['MODEL_DIR']);m=json.loads((p/'manifest.json').read_text())
          assert m['model_id']=='prithivMLmods/Flood-Image-Detection'
          assert m['revision']=='1fb5408d3b778c92c79b3a7894517ce794ad21f7'
          assert m['parity_validated'] is True and m['evaluation_approved'] is False and m['runtime_benchmark_validated'] is False
          assert m['fixtures_tested']==20 and m['logits_max_abs_error']<=0.001 and m['tensor_max_abs_error']<=1e-5
          for name,expected in [('model.onnx',m['sha256']),('processor.json',m['preprocessor_sha256'])]:
              h=hashlib.sha256()
              with (p/name).open('rb') as f:
                  for data in iter(lambda:f.read(4*1024*1024),b''):h.update(data)
              assert h.hexdigest()==expected
          assert (p/'model.onnx').stat().st_size==343342041
          print('IMMUTABLE_ONNX_AND_PROCESSOR_HASHES_VERIFIED')
          PY
      - name: Assume only main-branch Karan S3 model-upload role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::043063712559:role/monsoonroute-gh-model-uploader
          aws-region: ap-south-1
          allowed-account-ids: '043063712559'
          role-session-name: MonsoonModel${{ github.run_id }}
      - name: S3 checksummed immutable upload (manual approval still required)
        env:
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '043063712559'
          export AWS_REGION=ap-south-1 BUCKET=monsoonroute-prod-artifacts-043063712559-ap-south-1
          prefix=models/sha256/2517f3dfb5d82dc21a0729733fff7756eaca0b4b22026d153189501169a84d76
          upload_verified() {
            local file="$1" key="$2" hash="$3"
            local expected_base64
            expected_base64="$(openssl dgst -sha256 -binary "$file" | base64 -w0)"
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$file" --server-side-encryption AES256 \
              --checksum-sha256 "$expected_base64" --metadata "sha256=$hash,release-approval=not-approved" >/dev/null
            local got
            got="$(aws s3api head-object --bucket "$BUCKET" --key "$key" --checksum-mode ENABLED --query ChecksumSHA256 --output text)"
            test "$got" = "$expected_base64" || { echo 'S3_CHECKSUM_MISMATCH'; exit 1; }
          }
          upload_verified "$MODEL_DIR/model.onnx" "$prefix/model.onnx" '2517f3dfb5d82dc21a0729733fff7756eaca0b4b22026d153189501169a84d76'
          upload_verified "$MODEL_DIR/processor.json" "$prefix/processor.json" '3fb871613311dfae8c5641d034c0302fd69248c363b282b293709c49771ee696'
          upload_verified "$MODEL_DIR/manifest.json" "$prefix/manifest.json" "$(sha256sum "$MODEL_DIR/manifest.json" | cut -d' ' -f1)"
          echo 'PRIVATE_MODEL_OBJECT_UPLOAD_VERIFIED — NOT APPROVED FOR RUNTIME'
