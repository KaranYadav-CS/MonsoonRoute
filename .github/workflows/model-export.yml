name: monsoonroute-model-export
on:
  push:
    branches: [main]
    paths: ['models/export_pinned.py', '.github/workflows/model-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned export requirements
        run: python -m pip install transformers==4.50.3 huggingface_hub==0.33.4 onnx==1.17.0 onnxruntime==1.22.1 numpy==1.26.4 Pillow==11.3.0
      - name: Export pinned safe-format model and verify CPU parity
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_ETAG_TIMEOUT: '60'
        run: python models/export_pinned.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monsoonroute-onnx-numerical-only
          path: |
            models/build/model.onnx
            models/build/processor.json
            models/build/manifest.json
          retention-days: 7
          if-no-files-found: error
