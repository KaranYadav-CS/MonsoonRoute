name: monsoonroute-lockfile-generation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate_lockfile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: '22'
      - name: Resolve exact dependency lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile structure and frozen dependency resolution
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(l.lockfileVersion!==3||l.packages[''].name!==p.name||l.packages[''].version!==p.version)process.exit(2)"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive vetted lockfile for review and repository commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monsoonroute-reviewed-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified lockfile through scoped GitHub API
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already tracked; no mutation."
            exit 0
          fi
          encoded="$(base64 -w0 package-lock.json)"
          gh api -X PUT repos/KaranYadav-CS/MonsoonRoute/contents/package-lock.json \
            -f message='build(lock): commit CI-verified dependency graph' \
            -f content="$encoded" \
            -f branch='main' >/dev/null
          echo "Lockfile committed; latest branch must be validated by CI."
