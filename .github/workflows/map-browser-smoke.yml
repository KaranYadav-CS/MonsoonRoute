name: monsoonroute-real-basemap-browser-smoke
on:
  push:
    branches: [main]
    paths:
      - 'components/MapCanvas.tsx'
      - 'tests/e2e/map-basemap.spec.ts'
      - 'components/Planner.tsx'
      - 'components/ReportForm.tsx'
      - 'components/ReviewPanel.tsx'
      - 'components/HistoryPanel.tsx'
      - 'components/SiteHeader.tsx'
      - 'components/AuthForm.tsx'
      - 'app/auth/**'
      - 'app/account/**'
      - 'app/layout.tsx'

      - '.github/workflows/map-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/map-basemap.spec.ts
        env:
          CI: 'true'
          BASE_URL: 'https://monsoon-route-omega.vercel.app'
